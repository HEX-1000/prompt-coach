name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Run the tests
        shell: bash
        run: python -B -m unittest discover -s tests -v 2>&1 | tee unittest.log
      - name: Report the result as an annotation
        if: always()
        shell: python
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          import os, pathlib
          log = pathlib.Path("unittest.log")
          text = log.read_text(errors="replace").replace("\r", "") if log.exists() else "no unittest.log"
          failed = os.environ["JOB_STATUS"] != "success"
          text = text[-3500:] if failed else "\n".join(text.strip().splitlines()[-4:])
          text = text.replace("%", "%25").replace("\n", "%0A")
          print(("::error title=unittest::" if failed else "::notice title=unittest::") + text)
