name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Run the tests
        shell: bash
        run: python -B -m unittest discover -s tests -v 2>&1 | tee unittest.log
      - name: Show the failures as annotations
        if: failure()
        shell: python
        run: |
          import pathlib
          text = pathlib.Path("unittest.log").read_text(errors="replace")[-3500:]
          text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print("::error title=unittest::" + text)
